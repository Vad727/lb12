name: SCA and Security Gate

on:
  push:
  pull_request:

jobs:
  sca:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate SBOM
        run: |
          docker run --rm -v "$PWD:/src" aquasec/trivy:latest \
            fs --format cyclonedx --output /src/sbom.json /src

      - name: Scan dependencies
        run: |
          docker run --rm -v "$PWD:/src" aquasec/trivy:latest \
            fs --severity CRITICAL,HIGH,MEDIUM --format json --output /src/trivy_report.json /src

      - name: Security Gate
        run: |
          python - <<'PY'
          import json
          import sys

          with open("trivy_report.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          blocking = []
          for result in data.get("Results", []):
              for vuln in result.get("Vulnerabilities", []) or []:
                  severity = vuln.get("Severity", "")
                  if severity in ("CRITICAL", "HIGH"):
                      blocking.append(vuln)

          print(f"Total blocking vulnerabilities: {len(blocking)}")

          if blocking:
              print("Security Gate: FAILED")
              for vuln in blocking[:20]:
                  print(f"- {vuln.get('VulnerabilityID')} | {vuln.get('PkgName')} {vuln.get('InstalledVersion')} | {vuln.get('Severity')}")
              sys.exit(1)

          print("Security Gate: PASSED")
          PY

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: sca-reports
          path: |
            sbom.json
            trivy_report.json
